      // Seta o tema inicial no frame zero para evitar flash de cor errada.
      // Preferência explícita vence; sem preferência, segue a cor do dispositivo.
      (function() {
        try {
          var preference = localStorage.getItem('skull_theme_preference');
          var systemTheme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var initialTheme = preference === 'dark' || preference === 'light' ? preference : systemTheme;
          document.documentElement.dataset.theme = initialTheme;
          document.documentElement.style.colorScheme = initialTheme;
          var schemeMeta = document.querySelector('meta[name="color-scheme"]');
          if (schemeMeta) schemeMeta.setAttribute('content', initialTheme);
          if (initialTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var chromeColor = initialTheme === 'dark' ? '#0c1110' : '#f9faf9';
          // Remove metas com media= prefers-* (Chrome Android prioriza o SO e ignora o tema do app)
          var themeMeta = document.querySelector('meta[name="theme-color"]') || document.createElement('meta');
          themeMeta.setAttribute('name', 'theme-color');
          themeMeta.setAttribute('content', chromeColor);
          themeMeta.id = 'skull-theme-color';
          if (!themeMeta.parentNode) document.head.appendChild(themeMeta);
          var navBtn = document.getElementById('skull-navbutton-color') || document.querySelector('meta[name="msapplication-navbutton-color"]');
          if (navBtn) navBtn.setAttribute('content', chromeColor);
          var appleBar = document.getElementById('skull-apple-status-bar') || document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (appleBar) appleBar.setAttribute('content', initialTheme === 'dark' ? 'black' : 'default');
          document.documentElement.style.backgroundColor = chromeColor;
          document.documentElement.style.colorScheme = initialTheme;
          if (document.body) document.body.style.setProperty('background-color', chromeColor, 'important');
        } catch (e) {}
      })();

    <script>
        (function() {
            var h = location.hostname;
            var isDev = h === 'localhost' || h === '127.0.0.1' || h === '::1'

                || /^10\.\d+\.\d+\.\d+$/.test(h)
                || /^172\.(1[6-9]|2\d|3[0-1])\.\d+\.\d+$/.test(h);
            if (!isDev) return;

            var MARCA = 'skull_sw_dev_limpo';

            function limparCaches() {
                if (!('caches' in window)) return Promise.resolve();
                return caches.keys().then(function(keys) {
                    return Promise.all(keys.map(function(k) { return caches.delete(k); }));
                }).catch(function() {});
            }

            if (!('serviceWorker' in navigator)) { limparCaches(); return; }

            var controlada = !!navigator.serviceWorker.controller;

            navigator.serviceWorker.getRegistrations().then(function(regs) {
                return Promise.all(regs.map(function(r) { return r.unregister(); }))
                    .then(function() { return limparCaches(); })
                    .then(function() {
                        if (!controlada) return;
                        // A aba atual ainda é do worker antigo: só uma nova
                        // navegação pega o que o Vite está servindo agora.
                        var jaRecarregou = false;
                        try { jaRecarregou = sessionStorage.getItem(MARCA) === '1'; } catch (e) {}
                        if (jaRecarregou) return;
                        try { sessionStorage.setItem(MARCA, '1'); } catch (e) {}
                        console.info('[SW] worker antigo removido — recarregando com os arquivos do servidor de desenvolvimento.');
                        location.reload();
                    });
            }).catch(function() {});

            // Fora do fluxo acima: se o worker se desregistrar sozinho e a aba
            // perder o controlador, o navegador dispara este evento.
            navigator.serviceWorker.addEventListener('controllerchange', function() {
                try {
                    if (sessionStorage.getItem(MARCA) === '1') return;
                    sessionStorage.setItem(MARCA, '1');
                } catch (e) {}
                location.reload();
            });
        })();
    </script>
